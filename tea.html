<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卢布朗咖啡店 - 下午茶品种</title>
    <link rel="shortcut icon" href="./pic/syn.png" type="image/x-icon">
    <style>

        * {
            padding: 0;
            margin: 0;
        }
        body {
            height: 100vh;
            background: #94746e;
            z-index: -1;
            overflow-x: hidden;
            user-select: none;
        }
        .gridline {
            position: absolute;
            left: -20vw;
            width: 120vw;
            height: 100vh;
            animation: move 18s infinite ease-out;
        }
        .rows {
            position: absolute;
            display: flex;
            height: 100%;
            width: 100%;
        }
        .row {
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 7%;
        }
        .cols {
            position: absolute;
            display: flex;
            height: 100%;
            width: 100%;
            flex-direction: column;
        }
        .col {
            border: 1px solid rgba(255, 255, 255, 0.4);
            height: 7%;
        }
        @keyframes move {
            100% {
                transform: translateX(20vw);
            }
        }

        .container {
            position: relative;
            width: 90%;
            margin: 0 auto;
            padding-top: 5vh;
        }
        .header {
            background-color: #EFDFC7;
            padding: 2rem;
            border: 4px solid #94746e;
            margin-bottom: 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .header:hover {
            transform: scale(1.02);
        }
        .header h1 {
            color: #94746e;
            font-size: 48px;
            letter-spacing: 5px;
            margin-bottom: 1rem;
        }
        .header p {
            color: #94746e;
            font-size: 20px;
            font-style: italic;
        }
        .tea-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }
        .tea-card {
            background-color: #EFDFC7;
            border: 3px solid #94746e;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .tea-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .tea-card img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 1rem;
            transform: rotate(-5deg);
        }
        .tea-card h3 {
            color: #94746e;
            font-size: 24px;
            margin-bottom: 0.5rem;
        }
        .tea-card p {
            color: #702828;
            font-size: 16px;
        }
        .back-btn {
            position: fixed;
            bottom: 5vh;
            right: 5vw;
            background-color: #EFDFC7;
            border: 3px solid #94746e;
            padding: 1rem 2rem;
            color: #94746e;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
   
    <div class="gridline">
        <div class="rows">
            <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
            <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
            <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
            <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
        </div>
        <div class="cols">
            <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
            <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
            <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
            <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
        </div>
    </div>

    
    <div class="container">
        <div class="header">
            <h1>下午茶品种 (9种)</h1>
            <p>一口甜点，一杯咖啡，偷得浮生半日闲</p>
        </div>
        <div class="tea-list">
            <div class="tea-card">
                <img src="./pic/2.png" alt="⭐松饼">
                <h3>注入⭐松饼</h3>
                <p>外酥内软，搭配蜂蜜奶油</p>
            </div>
            <div class="tea-card">
                <img src="./pic/5.png" alt="提拉米苏">
                <h3>提拉米苏</h3>
                <p>咖啡酒浸泡手指饼干，丝滑马斯卡彭</p>
            </div>
            <div class="tea-card">
                <img src="./pic/焦糖布丁.jpg" alt="焦糖布丁">
                <h3>焦糖布丁</h3>
                <p>焦香脆皮，嫩滑布丁，入口即化</p>
            </div>
            <div class="tea-card">
                <img src="./pic/莓果挞.jpg" alt="莓果挞">
                <h3>莓果挞</h3>
                <p>新鲜莓果+酥脆挞皮，酸甜平衡</p>
            </div>
            <div class="tea-card">
                <img src="./pic/黄油可颂.jpg" alt="可颂">
                <h3>黄油可颂</h3>
                <p>层次分明，黄油香气浓郁</p>
            </div>
            <div class="tea-card">
                <img src="./pic/芝士蛋糕.jpg" alt="芝士蛋糕">
                <h3>纽约芝士蛋糕</h3>
                <p>浓郁芝士，饼干底酥脆</p>
            </div>
        </div>
        <button class="back-btn" onclick="window.location.href='index.html'">返回主页</button>
    </div>
</body>
</html>
