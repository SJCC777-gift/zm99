<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言界面</title>
    <link rel="shortcut icon" href="./pic/syn.png" type="image/x-icon">
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        body {
            height: 100vh;
            background: #94746e;
            z-index: -1;
            overflow-x: hidden;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .gridline {
            position: absolute;
            left: -20vw;
            width: 120vw;
            height: 100vh;
            animation: move 18s infinite ease-out;
            z-index: -1;
        }
        .rows {
            position: absolute;
            display: flex;
            height: 100%;
            width: 100%;
        }
        .row {
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 7%;
        }
        .cols {
            position: absolute;
            display: flex;
            height: 100%;
            width: 100%;
            flex-direction: column;
        }
        .col {
            border: 1px solid rgba(255, 255, 255, 0.4);
            height: 7%;
        }
        @keyframes move {
            100% {
                transform: translateX(20vw);
            }
        }
        .msg-box {
            background-color: #EFDFC7;
            border: 5px solid #94746e;
            width: 320px;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .msg-box h1 {
            color: #94746e;
            font-size: 36px;
            margin-bottom: 2rem;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 0.8rem;
            border: 3px solid #94746e;
            box-sizing: border-box;
            margin-bottom: 1rem;
            resize: none;
        }
        .btn {
            padding: 0.6rem 2rem;
            background-color: #94746e;
            color: #EFDFC7;
            border: none;
            cursor: pointer;
            margin: 0 0.5rem;
        }
        .back {
            margin-top: 1rem;
            display: inline-block;
            color: #702828;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="gridline">
        <div class="rows">
            <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
            <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
            <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
            <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
        </div>
        <div class="cols">
            <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
            <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
            <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
            <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
        </div>
    </div>
    <div class="msg-box">
        <h1>留言板块</h1>
        <textarea placeholder="请输入你的留言内容..."></textarea>
        <button class="btn">提交留言</button>
        <br>
        <a href="index.html" class="back">返回首页</a>
    </div>
</body>
</html>
